<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Talking to a real API with fetch.</p>
    </header>

    <main>
      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title (required, up to 100 characters)</label>
          <input type="text" id="title-input" placeholder="Note title" autocomplete="off" />

          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" rows="4" placeholder="Write something..."></textarea>

          <button type="submit" id="submit-btn">Add note</button>
        </form>
      </section>

      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">Notes from the server</h2>
        <button type="button" id="load-btn">Load notes</button>
        <p id="status" role="status" aria-live="polite">Click "Load notes" to get started.</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Practice data from JSONPlaceholder.</p>
    </footer>
  </body>
</html>
